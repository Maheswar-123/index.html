<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Racing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Sky blue background */
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            touch-action: none; /* Prevents accidental zooming/scrolling on mobile */
        }
        #gameArea {
            position: relative;
            margin-top: 20px;
        }
        canvas {
            background-color: #555; /* Dark gray road */
            border: 5px solid #fff;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }
        .score-board {
            color: #333;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            width: 300px;
            justify-content: space-between;
        }
        button {
            padding: 20px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            background-color: #FF4500; /* Bright orange buttons */
            color: white;
            flex-grow: 1;
            cursor: pointer;
            box-shadow: 0px 4px 0px #CC3700;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #CC3700;
        }
    </style>
</head>
<body>

    <div class="score-board">Score: <span id="score">0</span></div>
    
    <div id="gameArea">
        <canvas id="gameCanvas" width="300" height="450"></canvas>
    </div>

    <div class="controls">
        <button id="leftBtn">LEFT</button>
        <button id="rightBtn">RIGHT</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Player car settings
        let car = { x: 130, y: 360, width: 40, height: 70, speed: 25 };
        let obstacles = [];
        let score = 0;
        let gameFrames = 0;
        let gameOver = false;

        // Function to draw cars
        function drawCar(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 40, 70); // Main body
            ctx.fillStyle = "black";
            ctx.fillRect(x - 5, y + 10, 5, 15);  // Top-left wheel
            ctx.fillRect(x + 40, y + 10, 5, 15); // Top-right wheel
            ctx.fillRect(x - 5, y + 45, 5, 15);  // Bottom-left wheel
            ctx.fillRect(x + 40, y + 45, 5, 15); // Bottom-right wheel
        }

        // Movement logic
        function moveLeft() { if (!gameOver && car.x > 10) car.x -= car.speed; }
        function moveRight() { if (!gameOver && car.x < canvas.width - car.width - 10) car.x += car.speed; }

        // Touch & Click Event Listeners
        document.getElementById("leftBtn").addEventListener("touchstart", (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById("rightBtn").addEventListener("touchstart", (e) => { e.preventDefault(); moveRight(); });
        document.getElementById("leftBtn").addEventListener("mousedown", moveLeft);
        document.getElementById("rightBtn").addEventListener("mousedown", moveRight);

        // Keyboard support for computer testing
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft();
            if (e.key === "ArrowRight") moveRight();
        });

        // Restart game logic
        canvas.addEventListener("click", () => {
            if (gameOver) {
                gameOver = false;
                obstacles = [];
                score = 0;
                gameFrames = 0;
                car.x = 130;
                gameLoop();
            }
        });

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText("Game Over!", 65, 200);
                ctx.font = "20px Arial";
                ctx.fillText("Tap screen to restart", 55, 240);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Animate the white road lines
            ctx.fillStyle = "white";
            for (let i = 0; i < 5; i++) {
                let lineY = (gameFrames * 3 + i * 120) % 550 - 100;
                ctx.fillRect(145, lineY, 10, 60);
            }

            // Draw player (Blue car)
            drawCar(car.x, car.y, "#1E90FF");

            // Generate new obstacles randomly
            if (gameFrames % 80 === 0) {
                let lanes = [30, 130, 230];
                let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
                obstacles.push({ x: randomLane, y: -80, width: 40, height: 70, speed: 3 + Math.random() * 2 });
            }

            // Move and draw obstacles (Red cars)
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += obs.speed;
                drawCar(obs.x, obs.y, "#FF0000");

                // Check for crash
                if (car.x < obs.x + obs.width && car.x + car.width > obs.x &&
                    car.y < obs.y + obs.height && car.y + car.height > obs.y) {
                    gameOver = true;
                }
            }

            // Track score for cars successfully dodged
            obstacles.forEach(obs => {
                if (obs.y > canvas.height && !obs.passed) {
                    obs.passed = true;
                    score++;
                }
            });
            
            // Clean up memory
            obstacles = obstacles.filter(obs => obs.y < canvas.height + 100);
            
            scoreElement.innerText = score;
            gameFrames++;
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
